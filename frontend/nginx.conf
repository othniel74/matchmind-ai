server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto $scheme;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 client_max_body_size 64k;
 location /api/ { proxy_pass http://backend:8000; }
 location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 120s; }
 location / { try_files $uri $uri/ /index.html; }
}
